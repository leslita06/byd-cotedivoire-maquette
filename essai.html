<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow"><title>Réserver un essai | BYD Côte d'Ivoire</title>
<meta name="description" content="Maquette proposée par Yelema, non publiée. BYD Côte d'Ivoire par CFAO Mobility.">
<link rel="icon" href="img/favicon.png"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css?v=4"><script src="assets/data.js?v=1"></script></head>
<body data-page="essai" class="funnel-p">

<div class="funnel"><div class="wrap" id="app">
<div class="fhead"><div><span class="k">Essai gratuit, 45 minutes</span><h1>Réserver un essai</h1></div><span style="color:var(--mut);font-size:14px">Confirmation immédiate. Annulation libre.</span></div>
<div class="prog" id="prog"></div>
<div class="flay"><div class="panel" id="step"></div><aside class="recap"><div class="panel"><img id="rimg" src="img/atto3-1.jpg" alt=""><div class="in"><span class="k" style="margin:0 0 4px">Votre essai</span><h3 id="rname">BYD Atto 3</h3><dl id="rdl"></dl></div></div></aside></div>
</div>
<div class="wrap" id="fin" style="display:none"></div></div>
<script src="assets/app.js?v=2"></script><script>
const q=new URLSearchParams(location.search);
const S={m:BYD.models[q.get('m')]?q.get('m'):'atto3',s:q.get('s')||null,d:null,h:null,nom:'',tel:'',mail:''};
const steps=['Modèle et showroom','Date et créneau','Vos coordonnées'];let st=0;
const J=['Dim','Lun','Mar','Mer','Jeu','Ven','Sam'],Mo=['janv.','févr.','mars','avr.','mai','juin','juil.','août','sept.','oct.','nov.','déc.'];
const days=[];{let d=new Date();d.setHours(12);for(let i=1;days.length<14;i++){const x=new Date(d);x.setDate(d.getDate()+i);days.push(x)}}
const full=d=>J[d.getDay()].replace('Dim','dimanche').replace('Lun','lundi').replace('Mar','mardi').replace('Mer','mercredi').replace('Jeu','jeudi').replace('Ven','vendredi').replace('Sam','samedi')+' '+d.getDate()+' '+Mo[d.getMonth()];
const H=['08:30','09:30','10:30','11:30','14:00','15:00','16:00','17:00'];
const busy=i=>[(i*3)%8,(i*5+2)%8];
function recap(){const m=BYD.models[S.m],s=BYD.showrooms.find(x=>x.id===S.s);rimg.src='img/'+m.imgs[0]+'.jpg';rname.textContent='BYD '+m.name;
rdl.innerHTML=[['Showroom',s?s.name:'À choisir'],['Date',S.d!=null?full(days[S.d]):'À choisir'],['Heure',S.h||'À choisir'],['Durée','45 min, avec un conseiller'],['Prix','Gratuit']].map(r=>`<div><dt>${r[0]}</dt><dd>${r[1]}</dd></div>`).join('')}
function prog(){document.getElementById('prog').innerHTML=steps.map((n,i)=>`<div class="${i<st?'done':i===st?'on':''}"><i></i><span>${i+1}. ${n}</span></div>`).join('')}
function nav(ok,last){return `<div class="fnav">${st>0?'<button class="btn ghost" id="bk">Retour</button>':'<span></span>'}<button class="btn" id="nx" ${ok?'':'disabled'}>${last?'Confirmer mon essai':'Continuer'}</button></div>`}
function render(){prog();recap();const P=document.getElementById('step');
if(st===0){P.innerHTML=`<h2>Quel modèle voulez-vous conduire ?</h2><p class="sub">Tous nos modèles sont disponibles à l'essai.</p>
<div class="opts">${BYD.order.map(k=>{const m=BYD.models[k];return `<button class="opt mod ${S.m===k?'on':''}" data-m="${k}"><img src="img/${m.imgs[0]}.jpg" alt=""><div><b>${m.name}</b><span>${m.type}</span></div></button>`}).join('')}</div>
<h2 style="margin-top:30px">Dans quel showroom ?</h2><p class="sub">Un conseiller BYD vous accueille et vous accompagne.</p>
<div class="opts">${BYD.showrooms.map(s=>`<button class="opt ${S.s===s.id?'on':''}" data-s="${s.id}"><b>${s.name}</b><span>${s.city}, ${s.addr}</span><span>${s.hours}</span><span class="pill">${s.tag}</span></button>`).join('')}</div>`+nav(S.s);
 P.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{S.m=b.dataset.m;render()});P.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{S.s=b.dataset.s;render()});}
if(st===1){P.innerHTML=`<h2>Choisissez votre date</h2><p class="sub">Les 14 prochains jours. Fermé le dimanche.</p>
<div class="days">${days.map((d,i)=>`<button class="day ${d.getDay()===0?'off':''} ${S.d===i?'on':''}" data-d="${i}"><small>${J[d.getDay()]}</small><b>${d.getDate()}</b><small>${Mo[d.getMonth()]}</small></button>`).join('')}</div>
${S.d!=null?`<h2 style="margin-top:28px">Et votre créneau</h2><p class="sub">${full(days[S.d])}, à ${BYD.showrooms.find(x=>x.id===S.s).name}</p><div class="slots">${H.map((h,i)=>`<button class="slot ${busy(S.d).includes(i)?'off':''} ${S.h===h?'on':''}" data-h="${h}">${h.replace(':',' h ')}</button>`).join('')}</div>`:''}`+nav(S.d!=null&&S.h);
 P.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{S.d=+b.dataset.d;S.h=null;render()});P.querySelectorAll('[data-h]').forEach(b=>b.onclick=()=>{S.h=b.dataset.h;render()});}
if(st===2){P.innerHTML=`<h2>Vos coordonnées</h2><p class="sub">Pour confirmer le rendez-vous et vous envoyer un rappel la veille.</p>
<div class="form"><div class="full"><label for="nom">Nom et prénom</label><input id="nom" autocomplete="off" value="${S.nom}" placeholder="Ex. Aya Kouassi"></div>
<div><label for="tel">Téléphone (WhatsApp)</label><input id="tel" inputmode="tel" autocomplete="off" value="${S.tel}" placeholder="07 00 00 00 00"></div>
<div><label for="mail">E-mail (facultatif)</label><input id="mail" type="email" autocomplete="off" value="${S.mail}" placeholder="vous@exemple.ci"></div>
<div class="full"><label for="perm">Permis de conduire</label><select id="perm"><option>Oui, permis B valide</option><option>Je viendrai accompagné d'un conducteur</option></select></div>
<label class="chk full"><input type="checkbox" checked> Recevoir la confirmation et le rappel par WhatsApp</label></div>
<div class="notice">ⓘ Démonstration : rien n'est enregistré ni envoyé. Vous pouvez saisir des informations fictives.</div>`+nav(true,true);
 ['nom','tel','mail'].forEach(f=>{const i=document.getElementById(f);i.oninput=()=>S[f]=i.value});}
const bk=document.getElementById('bk');if(bk)bk.onclick=()=>{st--;render();scrollTo(0,0)};
document.getElementById('nx').onclick=()=>{if(st<2){st++;render();scrollTo(0,0)}else done()};}
function done(){const m=BYD.models[S.m],s=BYD.showrooms.find(x=>x.id===S.s),ref='ESS-'+(Date.now()%100000).toString().padStart(5,'0');
app.style.display='none';fin.style.display='block';const pr=(S.nom||'').trim().split(' ')[0];
fin.innerHTML=`<div class="done"><div class="ok"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3"><path d="M5 12l5 5 9-10"/></svg></div>
<span class="k">Essai confirmé</span><h1>${pr?pr+', votre':'Votre'} BYD ${m.name} vous attend.</h1>
<div class="ref">Référence ${ref}</div>
<div class="panel"><div style="display:flex;gap:18px;align-items:center;flex-wrap:wrap"><img src="img/${m.imgs[0]}.jpg" alt="" style="width:180px;border-radius:12px;aspect-ratio:3/2;object-fit:cover"><div><h3 style="font-size:22px">${full(days[S.d])} à ${S.h.replace(':',' h ')}</h3><p style="color:var(--mut)">${s.name}, ${s.addr}, ${s.city}<br>45 minutes avec un conseiller BYD. Pensez à votre permis.</p></div></div>
<div class="tl" style="margin-top:18px"><div class="y"><i>✓</i><div><b>Rendez-vous bloqué dans l'agenda du showroom</b><span>Le véhicule est préparé et chargé pour votre arrivée.</span></div></div>
<div class="y"><i>✓</i><div><b>Confirmation envoyée sur WhatsApp</b><span>Simulé pour la démonstration : aucun message réel.</span></div></div>
<div><i>3</i><div><b>Rappel la veille à 18 h</b><span>Avec le plan d'accès et le nom de votre conseiller.</span></div></div>
<div><i>4</i><div><b>Après l'essai</b><span>Votre offre personnalisée et une simulation de financement ou de location LOXEA.</span></div></div></div></div>
<div class="acts"><a class="btn" href="achat.html?m=${S.m}">Configurer ma ${m.name}</a><a class="btn ghost" href="#" onclick="return false">Ajouter à mon agenda</a><a class="btn ghost" href="index.html">Retour à l'accueil</a></div>
<p class="hyp">Maquette de démonstration : aucune donnée n'a été enregistrée.</p></div>`;scrollTo(0,0)}
if(S.s&&q.get('go')==='2'){st=1}
render();
</script></body></html>
